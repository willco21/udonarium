name: Generate Cards

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  export-gss-to-csv:
    # Allow the job to fetch a GitHub ID token
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread google-auth

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/7847873672/locations/global/workloadIdentityPools/github/providers/my-repo
        service_account: my-service-account@eng-cogency-213906.iam.gserviceaccount.com

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: 'Use gcloud CLI'
      run: 'gcloud info'

    - name: Extract Google credentials for gsheet.action
      id: extract_gsheet_creds
      run: |
        CLIENT_EMAIL=$(jq -r '.client_email' "$GOOGLE_APPLICATION_CREDENTIALS")
        PRIVATE_KEY=$(jq -r '.private_key' "$GOOGLE_APPLICATION_CREDENTIALS" | sed ':a;N;$!ba;s/\n/\\n/g')
        echo "GSHEET_CLIENT_EMAIL=$CLIENT_EMAIL" >> $GITHUB_ENV
        echo "GSHEET_PRIVATE_KEY=$PRIVATE_KEY" >> $GITHUB_ENV
      shell: bash

    - name: Export Google Sheet to CSV using gsheet.action
      id: export_gsheet
      uses: jroehl/gsheet.action@v2.0.0
      with:
        spreadsheetId: ${{ secrets.SHEET_ID }}
        commands: |
          [
            { "command": "getData", "args": { "worksheetTitle": "シート1" } }
          ]
      env:
        GSHEET_CLIENT_EMAIL: ${{ env.GSHEET_CLIENT_EMAIL }}
        GSHEET_PRIVATE_KEY: ${{ env.GSHEET_PRIVATE_KEY }}

    - name: Save exported data as CSV
      run: |
        echo '${{ steps.export_gsheet.outputs.results }}' | jq -r '.[] | @csv' > card_factory/source_csv/exported.csv
      shell: bash

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq
      if: failure() && !exists('jq')

    - name: Upload CSV files
      uses: actions/upload-artifact@v4
      with:
        name: exported-csv
        path: card_factory/source_csv/*.csv
        retention-days: 3

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: export-gss-to-csv

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y libgbm-dev libnss3 libatk1.0-0 libatk-bridge2.0-0 \
          libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
          libgtk-3-0 libasound2t64

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./card_factory/package-lock.json

    - name: Setup Chrome
      id: setup-chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 'stable'

    - name: Install npm dependencies
      working-directory: ./card_factory
      env:
        CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: |
        npm ci --production
        npm install puppeteer

    - name: Validate permissions
      run: |
        chmod +x ./card_factory/generate.sh
        ls -l ./card_factory/generate.sh

    - name: Run generate script with retry
      working-directory: ./card_factory
      env:
        CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
      run: |
        max_retries=3
        count=0
        until [ $count -ge $max_retries ]
        do
          ./generate.sh && exit 0
          count=$((count+1))
          echo "Retry $count/$max_retries"
          sleep 10
        done
        exit 1

    # Upload artifacts on failure
    - name: Upload error artifacts
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: error-artifacts
        path: |
          ./src/assets/images/card_factory/**
          ./card_factory/app/v1/card_html/**
          ./card_factory/source_csv/*
        retention-days: 1

    # Upload output artifacts on success
    - name: Upload output artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: generated-cards
        path: |
          ./src/assets/images/card_factory/**
          ./card_factory/app/v1/card_html/**
          ./card_factory/source_csv/*
        retention-days: 7
